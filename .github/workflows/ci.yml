name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gatehouse
          POSTGRES_PASSWORD: gatehouse
          POSTGRES_DB: gatehouse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatehouse -d gatehouse_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gatehouse:gatehouse@localhost:5432/gatehouse_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high

  image:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag gatehouse:ci .

  smoke:
    name: End-to-end smoke test (container stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up --build --detach
      - name: Wait for the service
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:4000/readyz > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Walk the main flows
        run: ./scripts/smoke.sh
      - name: Show service logs
        if: failure()
        run: docker compose logs
